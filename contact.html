<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — Creative Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; color: #2D3436; line-height: 1.6; background: #FFFBF5; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        h1 { font-family: 'Fredoka', sans-serif; color: #A78BFA; font-size: 2.5rem; margin-bottom: 20px; }
        p { margin-bottom: 30px; color: #636E72; font-size: 1.1rem; }
        .contact-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .email { font-size: 1.5rem; font-weight: 700; color: #FF6B6B; text-decoration: none; display: inline-block; margin: 20px 0; }
        .email:hover { text-decoration: underline; }
        .back-link { display: inline-block; margin-bottom: 30px; color: #4ECDC4; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Home</a>
        <div class="contact-card">
            <h1>Get in Touch</h1>
            <p>Have questions about our kids learning toy recommendations, our Pinterest automation tool, or just want to say hi?</p>
            <p>We'd love to hear from you!</p>
            
            <a href="mailto:hello@creativeplay.example.com" class="email">hello@creativeplay.example.com</a>
            
            <p style="margin-top: 30px; font-size: 0.9rem;">
                Or connect with us on <a href="https://www.pinterest.com/kidslearningtoys11/" target="_blank" style="color: #FF6B6B; font-weight: bold;">Pinterest</a>.
            </p>
        </div>
    </div>
</body>
</html>
